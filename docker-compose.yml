# docker-compose.yml — StudyFlow Pro Production Stack
# Runs: Express API + PostgreSQL + Nginx (static frontend)
#
# Usage:
#   docker-compose up -d
#   docker-compose logs -f api

version: '3.9'

services:
  # ── PostgreSQL Database ────────────────────
  db:
    image: postgres:16-alpine
    container_name: studyflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: studyflow
      POSTGRES_USER: ${DB_USER:-studyflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-studyflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Express API ────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyflow-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-studyflow}:${DB_PASSWORD}@db:5432/studyflow?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_SECURE: ${EMAIL_SECURE:-false}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_MAILTO: ${VAPID_MAILTO}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://study-flow-pro.onrender.com/api"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Nginx (serves frontend + proxies API) ──
  nginx:
    image: nginx:alpine
    container_name: studyflow-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./ssl:/etc/nginx/ssl:ro  # Uncomment for HTTPS
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: studyflow_postgres_data
